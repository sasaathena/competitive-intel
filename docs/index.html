<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報助理 · 產品情報與知識累積</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
:root {
  /* Beige × Forest Green palette (Product view) */
  --sand-50:  #FAFAF5;
  --sand-100: #F5F3EC;
  --sand-200: #EDE9DC;
  --sand-300: #DDD8C6;
  --sand-400: #C8C0A8;
  --sand-500: #A89F87;
  --sand-600: #857A62;

  --moss-50:  #EEF3EF;
  --moss-100: #CFDDD1;
  --moss-200: #9DBEA1;
  --moss-300: #6A9B70;
  --moss-400: #3D7245;
  --moss-500: #2A5430;
  --moss-600: #1C3B21;
  --moss-700: #112416;

  --warm-red: #C0503A;
  --warm-amber: #B5803A;
  --warm-sky: #3A6E8C;

  /* Amber palette (Tech view) */
  --amber-50:  #FBF6EC;
  --amber-100: #F4E7CE;
  --amber-200: #E9CFA1;
  --amber-300: #D9AF6E;
  --amber-400: #C88A3B;
  --amber-500: #A66C22;
  --amber-600: #7A4E17;
  --amber-700: #4C2F0A;

  --bg:        var(--sand-50);
  --bg2:       #FFFFFF;
  --bg3:       var(--sand-100);
  --border:    var(--sand-300);
  --border2:   var(--sand-400);
  --text:      #1C1A14;
  --text2:     #5A5646;
  --text3:     #8A8472;

  --sidebar-bg: var(--moss-600);
  --accent:     var(--moss-500);
  --accent-soft: var(--moss-50);

  --serif: 'Playfair Display', Georgia, serif;
  --sans:  'DM Sans', sans-serif;
  --mono:  'DM Mono', monospace;
  --r: 6px;
  --r2: 10px;
  --r3: 16px;
}

/* Tech view accent swap */
body.view-tech {
  --sidebar-bg: var(--amber-700);
  --accent: var(--amber-500);
  --accent-soft: var(--amber-50);
}

html { font-size: 15px; scroll-behavior: smooth }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
a { color: inherit; text-decoration: none }
button { font-family: var(--sans); cursor: pointer; border: none; background: none }
input  { font-family: var(--sans) }
::-webkit-scrollbar { width: 5px }
::-webkit-scrollbar-track { background: var(--sand-100) }
::-webkit-scrollbar-thumb { background: var(--sand-400); border-radius: 3px }

/* ── Layout ─────────────────────────────────────────────────── */
.app { display: flex; min-height: 100vh }

/* ── Sidebar ─────────────────────────────────────────────────── */
.sidebar {
  width: 236px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  transition: background .25s ease;
}
.sidebar-top {
  padding: 24px 22px 18px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.logo-mark {
  width: 32px; height: 32px;
  background: var(--sand-200);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  color: var(--sidebar-bg);
  flex-shrink: 0;
  transition: color .25s ease;
}
.logo-name {
  font-family: var(--sans), "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--sand-100);
  letter-spacing: .02em;
}
.logo-sub {
  font-size: 11px;
  color: rgba(255,255,255,.4);
  font-family: var(--mono);
  letter-spacing: .04em;
}

.nav-section { padding: 16px 12px 4px }
.nav-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.32);
  padding: 0 10px;
  margin-bottom: 5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: var(--r);
  font-size: 13.5px;
  color: rgba(255,255,255,.6);
  cursor: pointer;
  transition: all .15s;
  margin-bottom: 1px;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.9) }
.nav-item.active { background: rgba(255,255,255,.14); color: #fff }
.nav-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.nd-crm   { background: var(--moss-200) }
.nd-pms   { background: var(--warm-amber) }
.nd-fbm   { background: #D08A6D }
.nd-all   { background: rgba(255,255,255,.4) }
.nd-rss   { background: var(--warm-amber) }
.nd-th    { background: var(--warm-red) }
.nd-ai    { background: #E67E5A }
.nd-glo   { background: #8FB8D6 }
.nd-tw    { background: #F0D28C }
.nd-uxs   { background: #D5B48A }
.nav-count {
  margin-left: auto;
  font-size: 11px;
  font-family: var(--mono);
  color: rgba(255,255,255,.32);
  background: rgba(255,255,255,.06);
  padding: 1px 7px;
  border-radius: 10px;
}

.sync-footer {
  margin-top: auto;
  padding: 16px 22px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  color: rgba(255,255,255,.35);
}
.sync-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
  font-family: var(--mono);
}
.sync-led {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #6ECC7A;
  animation: blink 3s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Main ───────────────────────────────────────────────────── */
.main { flex: 1; overflow: hidden }

/* ── Topbar ─────────────────────────────────────────────────── */
.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 40;
}
.view-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg3);
  padding: 4px;
  border-radius: 22px;
  border: 1px solid var(--border);
}
.view-tab {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 18px;
  color: var(--text3);
  transition: all .18s ease;
  letter-spacing: .01em;
}
.view-tab:hover { color: var(--text2) }
.view-tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
.page-heading {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  color: var(--text2);
  flex: 1;
  letter-spacing: -.01em;
  font-style: italic;
  padding-left: 6px;
}
.search-wrap { position: relative }
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text3);
  pointer-events: none;
}
.search-input {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 14px 7px 34px;
  font-size: 13px;
  color: var(--text);
  width: 210px;
  outline: none;
  transition: border-color .15s, width .2s, box-shadow .15s;
}
.search-input::placeholder { color: var(--text3) }
.search-input:focus {
  border-color: var(--accent);
  width: 260px;
  box-shadow: 0 0 0 3px rgba(42,84,48,.08);
}
body.view-tech .search-input:focus { box-shadow: 0 0 0 3px rgba(200,138,59,.15) }
.refresh-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text2);
  font-size: 16px;
  transition: all .15s;
}
.refresh-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }

/* ── Content ─────────────────────────────────────────────────── */
.content { padding: 24px 32px 48px }

/* ── Metrics ─────────────────────────────────────────────────── */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.metric {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 16px 18px;
  transition: border-color .18s;
  position: relative;
  overflow: hidden;
}
.metric::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
}
.metric.m-green::before { background: var(--moss-400) }
.metric.m-sand::before  { background: var(--sand-400) }
.metric.m-red::before   { background: var(--warm-red) }
.metric.m-sky::before   { background: var(--warm-sky) }
.metric.m-amber::before { background: var(--amber-400) }
.metric:hover { border-color: var(--border2) }
.metric-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}
.metric-icon { font-size: 16px; opacity: .55 }
.metric-badge {
  font-size: 10px;
  font-family: var(--mono);
  padding: 2px 7px;
  border-radius: 10px;
}
.mb-up   { background: #E8F3EB; color: #2A5430 }
.mb-gray { background: var(--sand-100); color: var(--text3) }
.metric-val { font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: -.03em; line-height: 1 }
.metric-lbl { font-size: 11.5px; color: var(--text3); margin-top: 5px }

/* ── Filter Bar ─────────────────────────────────────────────── */
.filter-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 12px 16px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.filter-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text2);
  background: transparent;
  transition: all .15s;
}
.chip:hover { border-color: var(--border2); color: var(--text); background: var(--sand-100) }
.chip.active { border-color: transparent; color: #fff }
.chip-all.active     { background: var(--accent) }
.chip-crm.active     { background: var(--warm-sky) }
.chip-pms.active     { background: var(--warm-amber) }
.chip-fbm.active     { background: #B5603D }
.chip-tech.active    { background: var(--amber-500) }
.chip-zh.active      { background: var(--moss-500) }
/* content type chips (PRD 6 類) */
.chip-ct-p01.active  { background: var(--moss-500) }
.chip-ct-u01.active  { background: var(--warm-amber) }
.chip-ct-u02.active  { background: var(--sand-600) }
.chip-ct-a01.active  { background: var(--warm-red) }
.chip-ct-t01.active  { background: var(--warm-sky) }
.chip-ct-t02.active  { background: #4C7C8E }
/* tech sub-buckets */
.chip-sb-ai.active   { background: #E67E5A }
.chip-sb-glo.active  { background: #4C7C8E }
.chip-sb-tw.active   { background: var(--warm-amber) }
.chip-sb-ux.active   { background: var(--amber-500) }

/* ── List Header ─────────────────────────────────────────────── */
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.result-label {
  font-family: var(--serif);
  font-size: 15px;
  font-style: italic;
  color: var(--text3);
}
.result-label span { color: var(--text); font-style: normal; font-weight: 500 }
.sort-group { display: flex; gap: 6px }
.sort-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  border-radius: var(--r);
  font-size: 12px;
  color: var(--text3);
  border: 1px solid var(--border);
  background: var(--bg2);
  transition: all .15s;
}
.sort-btn:hover, .sort-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

/* ── Cards Grid ─────────────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

/* ── Card ───────────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r3);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .18s, transform .2s, box-shadow .2s;
  display: flex;
  flex-direction: column;
  position: relative;
}
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--moss-400);
  z-index: 2;
}
.card.card-tech::before { background: var(--amber-400) }
.card:hover {
  border-color: var(--sand-400);
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(28,26,20,.09);
}

/* Thumbnail */
.card-thumb {
  width: 100%;
  height: 148px;
  overflow: hidden;
  position: relative;
  background: var(--sand-100);
  flex-shrink: 0;
}
.card-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .4s ease;
  display: block;
}
.card:hover .card-thumb img { transform: scale(1.04) }
/* Monogram fallback — 代替 Unsplash 預設圖的品牌字母卡 */
.thumb-monogram {
  width: 100%; height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.thumb-monogram::before {
  /* 微弱網格紋，避免大面積純色 */
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(28,26,20,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(28,26,20,.045) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}
.mg-letter {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 92px;
  line-height: 1;
  letter-spacing: -.03em;
  color: rgba(28, 26, 20, .68);
  user-select: none;
  position: relative;      /* 疊在 ::before 網格之上 */
}
body.view-tech .mg-letter { color: rgba(76, 47, 10, .72); }
.mg-caption {
  position: absolute;
  bottom: 10px;
  left: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: rgba(28, 26, 20, .5);
  letter-spacing: .08em;
  text-transform: uppercase;
  max-width: calc(100% - 24px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* System / entity badge on thumb (Product view: emphasise brand) */
.thumb-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 10.5px;
  font-weight: 500;
  font-family: var(--mono);
  padding: 3px 8px;
  border-radius: 10px;
  letter-spacing: .04em;
}
.tb-crm  { background: var(--warm-sky);   color: #fff }
.tb-pms  { background: var(--warm-amber); color: #fff }
.tb-fbm  { background: #B5603D;            color: #fff }
.tb-tech { background: var(--amber-500);  color: #fff }

/* Brand chip — emphasised in Product view */
.thumb-brand-chip {
  position: absolute;
  bottom: 10px;
  left: 10px;
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.94);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  max-width: calc(100% - 20px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Language badge (top-right of thumb) */
.thumb-lang {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  font-family: var(--mono);
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 500;
  background: rgba(255,255,255,.92);
}
.lang-zh { color: var(--moss-600) }
.lang-en { color: var(--text3) }

/* Card body */
.card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 10px }
.card-source-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-source {
  font-size: 11.5px;
  color: var(--text3);
  font-family: var(--mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
.card-tech .card-source {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 500;
  color: var(--amber-600);
  font-style: italic;
}
.card-bm {
  width: 24px; height: 24px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3);
  font-size: 14px;
  transition: all .15s;
  background: transparent;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}
.card-bm:hover { color: var(--accent); background: var(--accent-soft) }
.card-bm.saved { color: var(--accent) }

.card-title {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-summary {
  font-size: 12px;
  line-height: 1.65;
  color: var(--text2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags { display: flex; gap: 5px; flex-wrap: wrap }
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 10px;
}
/* PRD 6 類 tag colour */
.tag-ct-p01   { background: #EEF3EF; color: var(--moss-500) }   /* 競品與產品更新 - 森林綠 */
.tag-ct-u01   { background: #FAF2E4; color: #7A5520 }           /* UIUX 設計案例 - 米棕 */
.tag-ct-u02   { background: var(--sand-100); color: var(--sand-600) } /* UX 研究趨勢 - 米灰 */
.tag-ct-a01   { background: #FBE9E4; color: var(--warm-red) }   /* AI 工具與工作流 - 磚紅 */
.tag-ct-t01   { background: #E1EBF0; color: #345D6D }           /* 前端 API - 藍 */
.tag-ct-t02   { background: #E3EEF0; color: #345D5F }           /* 架構資料 - 深青藍 */

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
}
.card-date {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}
.card-open {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  padding: 4px 10px;
  border-radius: var(--r);
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  transition: all .15s;
}
.card-open:hover { background: var(--accent); color: #fff }

/* ── Empty / Loading ─────────────────────────────────────────── */
.state-box {
  text-align: center;
  padding: 64px 24px;
  color: var(--text3);
}
.state-box .icon { font-size: 36px; margin-bottom: 12px; opacity: .3 }
.state-box p { font-family: var(--serif); font-size: 16px; font-style: italic }
.state-box small { font-size: 12px; display: block; margin-top: 6px }
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  margin: 0 auto 14px;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* ── Distribution ────────────────────────────────────────────── */
.dist-row {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 16px 20px;
  margin-bottom: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.dist-group h4 {

<script>
// ── State ──────────────────────────────────────────────────────
let all = [];
let view          = 'daily';      // 'daily' | 'product' | 'tech'
let filterSys     = '';           // Product: '', 'CRM', 'PMS', 'FBM'
let filterSubCat  = '';           // Tech:    '', 'AI', 'Global', 'TW', 'Design'
let filterType    = '';           // 內容類型 (八分類)
let filterChannel = '';           // '', 'rss', 'threads'
let filterLangPri = '';           // '', 'zh-TW'
let filterBrand   = '';           // Product view brand dropdown
let onlyBookmarks = false;
let searchQ       = '';
let sortMode      = 'score';
let bookmarks     = JSON.parse(localStorage.getItem('ci-bm') || '[]');

// 系統別名：Phase A 完全棄用 HR / EIP（映射為 null → 於 normSystems 排除）
const SYS_ALIAS = { EIP: null, HR: null };
function normSystems(sys) {
  if (!Array.isArray(sys)) return [];
  const out = [];
  const seen = new Set();
  for (const s of sys) {
    const mapped = Object.prototype.hasOwnProperty.call(SYS_ALIAS, s) ? SYS_ALIAS[s] : s;
    if (!mapped) continue;
    if (seen.has(mapped)) continue;
    seen.add(mapped);
    out.push(mapped);
  }
  return out;
}

// 舊 type 名稱 → PRD 6 類映射（商業新聞類別：融資/財報/人事 → null 直接丟棄）
const TYPE_ALIAS = {
  // Phase A 新 6 類 → 保留自身
  'P01 競品與產品更新':    'P01 競品與產品更新',
  'U01 UI/UX 設計案例':    'U01 UI/UX 設計案例',
  'U02 UX 研究與設計趨勢': 'U02 UX 研究與設計趨勢',
  'A01 AI 工具與工作流':   'A01 AI 工具與工作流',
  'T01 前端與 API 基礎':   'T01 前端與 API 基礎',
  'T02 產品架構與資料模型': 'T02 產品架構與資料模型',
  // 舊 8 類 → 新 6 類
  '產品更新':      'P01 競品與產品更新',
  '功能發布':      'P01 競品與產品更新',
  '功能更新':      'P01 競品與產品更新',
  '用戶體驗':      'U01 UI/UX 設計案例',
  'Dashboard案例': 'U01 UI/UX 設計案例',
  '產業趨勢':      'U02 UX 研究與設計趨勢',
  'AI 技術':       'A01 AI 工具與工作流',
  'AI應用':        'A01 AI 工具與工作流',
  // 商業新聞類別：丟棄
  '融資動態': null,
  '財報營運': null,
  '人事異動': null,
};
function normTypes(types) {
  if (!Array.isArray(types)) return [];
  const out = [];
  const seen = new Set();
  for (const t of types) {
    const mapped = Object.prototype.hasOwnProperty.call(TYPE_ALIAS, t) ? TYPE_ALIAS[t] : t;
    if (!mapped) continue;
    if (seen.has(mapped)) continue;
    seen.add(mapped);
    out.push(mapped);
  }
  return out;
}

// 語系優先權：繁中 > 英
const LANG_PRIORITY = { 'zh-TW': 2, en: 1 };

// PRD 6 類（P01/U01/U02/A01/T01/T02）
const CONTENT_TYPES = [

  'P01 競品與產品更新':    '競品與產品更新',
  'U01 UI/UX 設計案例':    'UI/UX 設計案例',

const TYPE_DIST_CLS = {
  'P01 競品與產品更新':    'df-moss',
  'U01 UI/UX 設計案例':    'df-amber',

// Tech 子分類（source name 前綴判定）
const TECH_SUBCATS = [
  { key: '', label: '全部主題', dot: 'nd-all' },
  { key: 'AI',     label: 'AI 前沿',   dot: 'nd-ai',  prefix: 'TECH/AI'     },
  { key: 'Global', label: '國際科技',  dot: 'nd-glo', prefix: 'TECH/Global' },
  { key: 'TW',     label: '台灣科技',  dot: 'nd-tw',  prefix: 'TECH/TW'     },
  { key: 'Design', label: '設計 / UX', dot: 'nd-uxs', prefix: 'TECH/Design' },
];
function techSubOf(sourceName) {
  if (!sourceName) return '';
  for (const s of TECH_SUBCATS) {
    if (s.prefix && sourceName.startsWith(s.prefix)) return s.key;
  }
  return '';
}

// ── URL sync ──────────────────────────────────────────────────
function syncURL() {
  const p = new URLSearchParams();
  if (view !== 'product') p.set('view', view);
  if (filterSys)     p.set('sys',  filterSys);
  if (filterSubCat)  p.set('sub',  filterSubCat);
  if (filterType)    p.set('type', filterType);
  if (filterBrand)   p.set('brand', filterBrand);
  const q = p.toString();
  history.replaceState(null, '', q ? '?' + q : location.pathname);
}
function loadURL() {
  const p = new URLSearchParams(location.search);
  const v = p.get('view');
  if (v === 'tech' || v === 'product' || v === 'daily') view = v;
  filterSys    = p.get('sys')   || '';
  filterSubCat = p.get('sub')   || '';
  filterType   = p.get('type')  || '';
  filterBrand  = p.get('brand') || '';
}

// ── Load ───────────────────────────────────────────────────────
async function loadData() {
  show('loading');
  hide('metrics-row','dist-row','filter-wrap','list-header','cards-grid','empty-state');

  try {
    const r = await fetch('data/articles.json?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    all = (d.articles || []).map(a => ({
      ...a,
      systems: normSystems(a.systems),
      types:   normTypes(a.types),
      _sub:    techSubOf(a.source || '')
    }));
    applyView();
    applyStats(d.stats || {});
    hide('loading');
    show('metrics-row','dist-row','filter-wrap','list-header','cards-grid');
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div class="icon">⚠</div><p>無法載入 data/articles.json</p><small>請確認爬蟲已執行或路徑正確</small>`;
  }
}

// ── View switch ────────────────────────────────────────────────
function setView(v) {
  if (view === v) return;
  view = v;
  // 切換 view 時清掉不屬於該 view 的 filter
  if (v === 'product') { filterSubCat = ''; }
  else if (v === 'tech') { filterSys = ''; filterBrand = ''; }
  else /* daily */     { filterSys = ''; filterSubCat = ''; filterBrand = ''; }
  applyView();
  render();
  syncURL();
}
function applyView() {
  document.body.classList.toggle('view-tech',  view === 'tech');
  document.body.classList.toggle('view-daily', view === 'daily');
  document.getElementById('tab-daily').classList.toggle('active',   view === 'daily');
  document.getElementById('tab-product').classList.toggle('active', view === 'product');
  document.getElementById('tab-tech').classList.toggle('active',    view === 'tech');
  const subMap = { daily: '每日精選 · 優先閱讀', product: 'CRM · PMS · FBM', tech: 'AI · GLOBAL · UX' };
  setText('logo-sub', subMap[view] || 'INTEL');
  renderSidebar();
  renderFilterBar();
  renderMetricsSkeleton();
  toggleDailyChrome();
}

// Daily view 隱藏傳統的 metrics/dist/filter/list，顯示 Daily Brief 區塊
function toggleDailyChrome() {
  const isDaily = view === 'daily';
  const dailyView = document.getElementById('daily-view');
  if (dailyView) dailyView.style.display = isDaily ? '' : 'none';
  ['metrics-row','dist-row','filter-wrap','list-header','cards-grid'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.display = isDaily ? 'none' : '';
  });
  const empty = document.getElementById('empty-state');
  if (empty && isDaily) empty.style.display = 'none';
}

// ── Stats ─────────────────────────────────────────────────────
function computeCounts() {
  const byChannel = {}, bySystem = {}, bySub = {};
  let productTotal = 0, techTotal = 0;
  for (const a of all) {
    byChannel[a.channel] = (byChannel[a.channel] || 0) + 1;
    for (const s of a.systems || []) {
      bySystem[s] = (bySystem[s] || 0) + 1;
      if (s === 'TECH') techTotal++;
      else if (s === 'PMS' || s === 'CRM' || s === 'FBM') productTotal++;
    }
    if (a._sub) bySub[a._sub] = (bySub[a._sub] || 0) + 1;
  }
  return { total: all.length, byChannel, bySystem, bySub, productTotal, techTotal };
}
function brandOptions() {
  const set = new Set();
  for (const a of all) {
    if (view === 'product' && !(a.systems || []).some(s => s !== 'TECH')) continue;
    (a.brands || []).forEach(b => set.add(b));
  }
  return [...set].sort();
}

function applyStats(s) {
  const t = s.last_updated ? new Date(s.last_updated).toLocaleString('zh-TW',{
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'
  }) : '—';
  setText('sync-time', t);
}

function updateMetrics(items) {
  const today = items.filter(a => {
    const d = new Date(a.date);
    return (Date.now() - d) < 86400 * 1000;
  }).length;
  setText('m-total', items.length);
  setText('m-today', today);
  setText('badge-new',   '+' + today + ' 今日');
  setText('badge-today', today + ' 篇');

  if (view === 'tech') {
    // 熱門主題（top type + 次數）
    const typeCount = {};
    for (const a of items) for (const t of a.types || []) typeCount[t] = (typeCount[t] || 0) + 1;
    const top = Object.entries(typeCount).sort((a,b) => b[1]-a[1])[0];
    setText('m-mid', top ? top[1] : 0);
    // 來源多樣性
    const srcSet = new Set(items.map(a => (a.source || '').split('·')[0]));
    setText('m-right', srcSet.size);
  } else {
    // P01 競品與產品更新 合計
    let prod = 0;
    for (const a of items) if ((a.types || []).some(t => t === 'P01 競品與產品更新')) prod++;
    setText('m-mid', prod);
    // 品牌覆蓋
    const brandSet = new Set();
    for (const a of items) (a.brands || []).forEach(b => brandSet.add(b));
    setText('m-right', brandSet.size);
  }

  // Distribution
  const distLeft = {};
  if (view === 'tech') {
    for (const a of items) if (a._sub) {
      const label = TECH_SUBCATS.find(s => s.key === a._sub)?.label || a._sub;
      distLeft[label] = (distLeft[label] || 0) + 1;
    }
  } else {
    for (const a of items) for (const s of a.systems || []) {
      if (s === 'TECH') continue;
      distLeft[s] = (distLeft[s] || 0) + 1;
    }
  }
  const distTypes = {};
  for (const a of items) for (const t of a.types || []) distTypes[t] = (distTypes[t] || 0) + 1;

  renderDist('dist-systems', distLeft,
    view === 'tech'
      ? {'AI 前沿':'df-red','國際科技':'df-teal','台灣科技':'df-amber','設計 / UX':'df-amber2'}
      : {CRM:'df-sky', PMS:'df-amber', FBM:'df-fbm'});
  renderDist('dist-types', distTypes, TYPE_DIST_CLS);
}

function renderDist(id, data, colors) {
  const max = Math.max(...Object.values(data), 1);
  document.getElementById(id).innerHTML = Object.entries(data)
    .sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `
    <div class="dist-item">
      <span class="dist-name" title="${esc(k)}">${esc(typeLabel(k))}</span>
      <div class="dist-track"><div class="dist-fill ${colors[k]||'df-sand'}" style="width:${Math.round(v/max*100)}%"></div></div>
      <span class="dist-num">${v}</span>
    </div>`).join('');
}

// ── Filter setters ────────────────────────────────────────────
function setSys(v)     { filterSys = v;     onlyBookmarks = false; renderSidebar(); renderFilterBar(); render(); syncURL(); }
function setSysNav(v)  { setSys(v); }
function setSubCat(v)  { filterSubCat = v;  onlyBookmarks = false; renderSidebar(); renderFilterBar(); render(); syncURL(); }
function setType(v)    { filterType = v;    renderFilterBar(); render(); syncURL(); }
function setChannel(v) { filterChannel = v; renderSidebar();   render(); syncURL(); }
function setLangPri(v) { filterLangPri = v; renderFilterBar(); render(); }
function setBrand(v)   { filterBrand = v;   renderFilterBar(); render(); syncURL(); }
function toggleBookmarksNav() { onlyBookmarks = !onlyBookmarks; renderSidebar(); render(); }
function setSort(m) {
  sortMode = m;
  document.getElementById('sort-score').classList.toggle('active', m==='score');
  document.getElementById('sort-date').classList.toggle('active',  m==='date');
  render();
}
function onSearch() {
  searchQ = document.getElementById('search-input').value.trim().toLowerCase();
  render();
}

// ── Render ─────────────────────────────────────────────────────
function langOf(a) {
  if (a.lang && a.lang !== 'ja') return a.lang;
  if (a.lang === 'ja') return 'en'; // 舊資料若為 ja，視為英文歸類
  return a.is_zhtw ? 'zh-TW' : 'en';
}
function belongsToView(a) {
  const sys = a.systems || [];
  const isTech = sys.includes('TECH');
  const isProduct = sys.some(s => s === 'CRM' || s === 'PMS' || s === 'FBM');
  if (view === 'tech')    return isTech;
  return isProduct;   // 產品領域 view 排除純 TECH 文章
}

function render() {
  toggleDailyChrome();  // 確保傳統視圖元素在 daily view 下保持隱藏（避免 loadData 的 show() 殘留）
  if (view === 'daily') { renderDaily(); return; }

  let items = all.filter(a => {
    if (!belongsToView(a)) return false;
    if (onlyBookmarks && !bookmarks.includes(a.id)) return false;
    if (filterChannel && a.channel !== filterChannel) return false;
    if (view === 'product' && filterSys && !a.systems?.includes(filterSys)) return false;
    if (view === 'tech' && filterSubCat && a._sub !== filterSubCat) return false;
    if (filterType && !a.types?.includes(filterType)) return false;
    if (filterLangPri && langOf(a) !== filterLangPri) return false;
    if (filterBrand && !(a.brands || []).includes(filterBrand)) return false;
    if (searchQ) {
      const hay = (a.title + a.summary + a.source + (a.types||[]).join(' ') + (a.brands||[]).join(' ')).toLowerCase();
      if (!hay.includes(searchQ)) return false;
    }
    return true;
  });

  if (sortMode === 'date') {
    items.sort((a,b) => new Date(b.date) - new Date(a.date));
  } else {
    items.sort((a,b) => {
      const la = LANG_PRIORITY[langOf(a)] || 0;
      const lb = LANG_PRIORITY[langOf(b)] || 0;
      if (la !== lb) return lb - la;
      return (b.score||0) - (a.score||0);
    });
  }

  setText('shown-count', items.length);
  show('list-header');
  updateMetrics(items);

  // page heading
  const parts = [view === 'tech' ? '科技趨勢' : '產品領域'];
  if (view === 'product' && filterSys)    parts.push(filterSys);
  if (view === 'tech'    && filterSubCat) parts.push(TECH_SUBCATS.find(s => s.key === filterSubCat)?.label || filterSubCat);
  if (filterType)  parts.push(filterType);
  if (onlyBookmarks) parts.push('★ 收藏');
  setText('page-heading', parts.join(' · '));

  const grid = document.getElementById('cards-grid');
  if (items.length === 0) {
    grid.innerHTML = '';
    hide('cards-grid');
    show('empty-state');
    return;
  }
  hide('empty-state');
  show('cards-grid');
  grid.innerHTML = items.map(renderCard).join('');
  attachThumbErrorHandlers(grid);
}

// ── Daily Brief render（PRD §9）──────────────────────────────
function renderDaily() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', weekday:'short' });
  setText('ov-date', dateStr);
  setText('page-heading', '每日情報 · ' + dateStr);

  const dayMs = 86400 * 1000;
  const today24h = all.filter(a => a.date && (now - new Date(a.date)) < dayMs).length;
  const priority = all.filter(a => (+a.score || 0) >= 75).length;
  setText('ov-new',  today24h);
  setText('ov-prio', priority);

  // 熱門類別
  const typeCount = {};
  for (const a of all) for (const t of (a.types || [])) typeCount[t] = (typeCount[t] || 0) + 1;
  const topEntry = Object.entries(typeCount).sort((a,b) => b[1] - a[1])[0];
  const topLabel = topEntry ? (typeLabel(topEntry[0]) + ' (' + topEntry[1] + ')') : '—';
  setText('ov-topcat', topLabel);

  // 今日最值得關注：score 最高的那篇
  const top1 = [...all].sort((a,b) => (+b.score || 0) - (+a.score || 0))[0];
  const hlWrap = document.getElementById('ov-highlight-wrap');
  if (top1 && (+top1.score || 0) >= 55) {
    hlWrap.style.display = '';
    setText('ov-highlight-text', top1.title);
    hlWrap.onclick = () => openCardDetail(top1.id);
    hlWrap.style.cursor = 'pointer';
  } else {
    hlWrap.style.display = 'none';
  }

  // 精選：score ≥ 55，依分類多樣性挑選（每類最多 1 篇），top 5，依分數排序
  const sortedByScore = [...all]
    .filter(a => (+a.score || 0) >= 55)
    .sort((a,b) => (+b.score || 0) - (+a.score || 0));
  const featured = [];
  const seenTypes = new Set();
  for (const a of sortedByScore) {
    const primaryType = (a.types || [])[0];
    if (primaryType && seenTypes.has(primaryType)) continue;
    featured.push(a);
    if (primaryType) seenTypes.add(primaryType);
    if (featured.length >= 5) break;
  }

  const grid = document.getElementById('featured-cards');
  const emptyBox = document.getElementById('featured-empty');
  const cntLabel = document.getElementById('featured-count');
  cntLabel.textContent = featured.length ? `· ${featured.length} 篇` : '';
  if (featured.length < 3) {
    // PRD 規則：不足 3 則不湊版面
    grid.innerHTML = '';
    grid.style.display = 'none';
    emptyBox.style.display = '';
  } else {
    grid.style.display = '';
    emptyBox.style.display = 'none';
    grid.innerHTML = featured.map(renderCard).join('');
    attachThumbErrorHandlers(grid);
  }

  // 建議行動：P01 / U01 / A01 各挑最高分一篇
  const actionTypes = [
    { tag: 'P01 競品與產品更新', kicker: '競品案例', fallback: '目前無高分競品更新' },
    { tag: 'U01 UI/UX 設計案例', kicker: '設計學習', fallback: '目前無高分設計案例' },
    { tag: 'A01 AI 工具與工作流', kicker: 'AI 工具',  fallback: '目前無高分 AI 工具' },
  ];
  const actionsHtml = actionTypes.map(cfg => {
    const pick = all
      .filter(a => (a.types || []).includes(cfg.tag) && (+a.score || 0) >= 40)
      .sort((a,b) => (+b.score || 0) - (+a.score || 0))[0];
    if (!pick) {
      return `<div class="action-card" style="opacity:.5;cursor:default">
        <div class="action-card-kicker">${esc(cfg.kicker)}</div>
        <div class="action-card-title">${esc(cfg.fallback)}</div>
      </div>`;
    }
    const srcLabel = cleanSource(pick.source || '');
    const brand = (pick.brands || [])[0];
    const meta = [brand || srcLabel, '分數 ' + (pick.score || 0)].filter(Boolean).join(' · ');
    return `<div class="action-card" onclick="openCardDetail('${esc(pick.id)}')">
      <div class="action-card-kicker">${esc(cfg.kicker)}</div>
      <div class="action-card-title">${esc(pick.title)}</div>
      <div class="action-card-meta">${esc(meta)}</div>
    </div>`;
  }).join('');
  document.getElementById('actions-grid').innerHTML = actionsHtml;
}

// ── Card HTML ──────────────────────────────────────────────────
const SYS_CLS   = { CRM:'tb-crm', PMS:'tb-pms', FBM:'tb-fbm', TECH:'tb-tech' };
const SYS_LABEL = { CRM:'CRM', PMS:'PMS', FBM:'FBM', TECH:'TECH' };
const THUMB_COLORS = {
  CRM:  'background:linear-gradient(135deg,#D3E4EE 0%,#EEF4F7 100%)',
  PMS:  'background:linear-gradient(135deg,#F1E1C0 0%,#FAF4E6 100%)',
  FBM:  'background:linear-gradient(135deg,#E8CDBE 0%,#F7EDE4 100%)',
  TECH: 'background:linear-gradient(135deg,#F4E7CE 0%,#FBF6EC 100%)',
};
// 後端沒抽到圖時會寫入這張 Unsplash URL，當 fallback sentinel 處理
const FALLBACK_THUMB_SIG = 'photo-1552664730';
function isFallbackThumb(u) { return !u || String(u).includes(FALLBACK_THUMB_SIG); }
function monogramLetter(brand, source) {
  const raw = (brand || cleanSource(source) || '').replace(/^the\s+/i, '').trim();
  const ch = raw.charAt(0);
  return ch ? ch.toUpperCase() : '◎';
}
function monogramHTML(sys, brand, source, showCaption) {
  const letter = monogramLetter(brand, source);
  const caption = showCaption
    ? `<div class="mg-caption">${esc(cleanSource(source || ''))}</div>`
    : '';
  return `<div class="thumb-monogram" style="${THUMB_COLORS[sys]||''}">
    <div class="mg-letter">${esc(letter)}</div>
    ${caption}
  </div>`;
}
const LANG_LABEL  = { 'zh-TW':'繁', en:'EN' };
const LANG_CLS    = { 'zh-TW':'lang-zh', en:'lang-en' };

// 產品更新狀態（PRD §5.4）
const STATUS_META = {
  Announced:  { cls: 'status-ann',  label: '已公布' },
  Beta:       { cls: 'status-beta', label: '測試版' },
  GA:         { cls: 'status-ga',   label: '正式發布' },
  Deprecated: { cls: 'status-dep',  label: '已淘汰' },
  Unverified: { cls: 'status-unv',  label: '未確認' },
};

// 推薦區間（PRD §6.2）
function scoreTier(score) {
  const s = +score || 0;
  if (s >= 75) return { cls: 'tier-priority',  label: '⚡ 優先', priority: 3 };
  if (s >= 55) return { cls: 'tier-recommend', label: '推薦',   priority: 2 };
  if (s >= 40) return { cls: 'tier-weekly',    label: '彙整',   priority: 1 };
  return null;
}

// 6 維度顯示名
const SCORE_DIM_META = [
  { key: 'work_relevance', label: '工作相關性', max: 25 },
  { key: 'domain_match',   label: '產品領域',   max: 20 },
  { key: 'applicability',  label: '可應用程度', max: 20 },
  { key: 'source_trust',   label: '來源可信度', max: 15 },
  { key: 'recency',        label: '時效性',     max: 10 },
  { key: 'novelty',        label: '新穎性',     max: 10 },
];

function primarySystem(a) {
  const sys = a.systems || [];
  if (view === 'tech' && sys.includes('TECH')) return 'TECH';
  const order = ['CRM','PMS','FBM','TECH'];
  return order.find(s => sys.includes(s)) || 'CRM';
}
function cleanSource(src) {
  if (!src) return '';
  // TECH/AI·Anthropic → Anthropic
  const parts = src.split('·');
  return parts.length > 1 ? parts.slice(1).join('·') : src;
}

function renderCard(a) {
  const sys   = primarySystem(a);
  const bm    = bookmarks.includes(a.id);
  const tags  = (a.types || []).slice(0,3);
  const rel   = relTime(a.date);
  const safeUrl = esc(a.url);
  const safeId  = esc(a.id);
  const lang    = langOf(a);
  const isTech  = sys === 'TECH';
  const brand   = (a.brands || [])[0];

  // Product view 下方已有 brand chip，不需 caption；Tech view 顯示來源名
  const mgShowCaption = isTech;
  const thumbHtml = isFallbackThumb(a.thumbnail)
    ? monogramHTML(sys, brand, a.source, mgShowCaption)
    : `<img src="${esc(a.thumbnail)}" alt="" loading="lazy"
            data-sys="${sys}"
            data-brand="${esc(brand || '')}"
            data-source="${esc(a.source || '')}"
            data-caption="${mgShowCaption ? '1' : '0'}">`;

  const tagHtml = tags.map(t =>
    `<span class="tag ${TYPE_CLS[t]||'tag-ct-u02'}" title="${esc(t)}">${esc(typeLabel(t))}</span>`).join('');

  const brandChip = (!isTech && brand)
    ? `<span class="thumb-brand-chip">${esc(brand)}</span>` : '';

  // Release status badge：Unverified 隱藏避免噪音
  const status = a.release_status || 'Unverified';
  const sm = STATUS_META[status];
  const statusHtml = (sm && status !== 'Unverified')
    ? `<span class="thumb-status ${sm.cls}" title="產品狀態">${sm.label}</span>` : '';

  return `
  <div class="card ${isTech ? 'card-tech' : ''}" onclick="openCardDetail('${safeId}')">
    <div class="card-thumb">
      ${thumbHtml}
      <span class="thumb-badge ${SYS_CLS[sys]||'tb-crm'}">${SYS_LABEL[sys]||sys}</span>
      <span class="thumb-lang ${LANG_CLS[lang]||'lang-en'}">${LANG_LABEL[lang]||'EN'}</span>
      ${brandChip}
      ${statusHtml}
    </div>
    <div class="card-body">
      <div class="card-source-row">
        <span class="card-source" title="${esc(a.source)}">${esc(cleanSource(a.source))}</span>
        ${(() => { const t = scoreTier(a.score); return t ? `<span class="card-tier ${t.cls}" title="分數 ${a.score}">${t.label}</span>` : ''; })()}
        <button class="card-bm ${bm?'saved':''}" onclick="toggleBm(event,'${safeId}')" title="收藏">
          ${bm ? '★' : '☆'}
        </button>
      </div>
      <div class="card-title">${esc(a.title)}</div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ''}
      <div class="card-tags">${tagHtml}</div>
      <div class="card-footer">
        <span class="card-date">${rel}</span>
        <span class="card-open">前往 →</span>
      </div>
    </div>
  </div>`;
}

function attachThumbErrorHandlers(root) {
  // 掛在 outerHTML 替換：只替換 <img>，保留 badge / lang / brand chip
  root.querySelectorAll('.card-thumb img').forEach(img => {
    img.addEventListener('error', () => {
      const sys = img.dataset.sys || 'CRM';
      const brand = img.dataset.brand || '';
      const source = img.dataset.source || '';
      const showCaption = img.dataset.caption === '1';
      img.outerHTML = monogramHTML(sys, brand, source, showCaption);
    }, { once: true });
  });
}

// ── Actions ────────────────────────────────────────────────────
// 卡片點擊：Phase A 起改為開啟詳情抽屜（原本直接外連由抽屜「前往原文」承接）
function openCard(url) { window.open(url, '_blank', 'noopener') }

function toggleBm(e, id) {
  e.stopPropagation();
  if (bookmarks.includes(id)) {
    bookmarks = bookmarks.filter(b => b !== id);
    toast('已取消收藏');
  } else {
    bookmarks.push(id);
    toast('已加入收藏 ★');
  }
  localStorage.setItem('ci-bm', JSON.stringify(bookmarks));
  renderSidebar();
  render();
}

// ── Card Detail Drawer（Phase A）───────────────────────────────
let drawerArticleId = null;

function openCardDetail(id) {
  const a = all.find(x => x.id === id);
  if (!a) return;
  drawerArticleId = id;

  const bm      = bookmarks.includes(id);
  const status  = a.release_status || 'Unverified';
  const sm      = STATUS_META[status] || STATUS_META.Unverified;
  const types   = (a.types || []).slice(0, 4);
  const typeTags = types.map(t =>
    `<span class="tag ${TYPE_CLS[t]||'tag-ct-u02'}" title="${esc(t)}">${esc(typeLabel(t))}</span>`).join('');
  const brand   = (a.brands || [])[0];
  const sys     = primarySystem(a);
  const dateStr = a.date
    ? new Date(a.date).toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' })
    : '—';
  const sourceLabel = cleanSource(a.source || '');
  const lang = langOf(a);
  const langLbl = LANG_LABEL[lang] || 'EN';

  // 事實摘要 vs AI 推論分開呈現（PRD §11.1 要求）
  const factHtml = a.summary
    ? `<p>${esc(a.summary)}</p>`
    : '<span class="placeholder">無原文摘要</span>';
  const aiAnalysisHtml = a.ai_analysis
    ? `<p>${esc(a.ai_analysis)}</p>`
    : '<span class="placeholder">尚未產生 AI 分析（Phase B 導入）</span>';
  const uxInsightHtml = a.ux_insight
    ? `<p>${esc(a.ux_insight)}</p>`
    : '<span class="placeholder">尚未產生 UI/UX 啟發（Phase B 導入）</span>';
  const workRelHtml = a.work_relevance
    ? `<p>${esc(a.work_relevance)}</p>`
    : '<span class="placeholder">尚未產生工作關聯（Phase B 導入）</span>';
  const reasonHtml = a.recommendation_reason
    ? `<p>${esc(a.recommendation_reason)}</p>`
    : '<span class="placeholder">尚未產生推薦理由（Phase B 導入 100 分制推薦）</span>';

  const d = document.getElementById('drawer');
  d.innerHTML = `
    <div class="drawer-head">
      <div class="drawer-head-main">
        <div class="drawer-eyebrow">
          <span>${esc(SYS_LABEL[sys] || sys)}</span>
          ${brand ? `<span class="sep">·</span><span>${esc(brand)}</span>` : ''}
          <span class="sep">·</span><span>${esc(langLbl)}</span>
        </div>
        <div class="drawer-title">${esc(a.title || '')}</div>
      </div>
      <button class="drawer-close" onclick="closeDrawer()" aria-label="關閉">×</button>
    </div>
    <div class="drawer-meta">
      <span class="dm-item">${esc(sourceLabel || '—')}</span>
      <span class="dm-item">${dateStr}</span>
      <span class="dm-item drawer-status ${sm.cls}">${sm.label}</span>
    </div>
    <div class="drawer-body">
      <div class="drawer-section">
        <h5>主題分類</h5>
        <div class="drawer-tags">${typeTags || '<span class="placeholder">尚未分類</span>'}</div>
      </div>
      <div class="drawer-section">
        <h5>事實摘要</h5>
        ${factHtml}
      </div>
      <div class="drawer-section">
        <h5>AI 分析</h5>
        ${aiAnalysisHtml}
      </div>
      <div class="drawer-section">
        <h5>UI/UX 啟發</h5>
        ${uxInsightHtml}
      </div>
      <div class="drawer-section">
        <h5>工作關聯</h5>
        ${workRelHtml}
      </div>
      <div class="drawer-section">
        <h5>推薦理由</h5>
        ${reasonHtml}
        ${renderScoreBreakdown(a)}
      </div>
    </div>
    <div class="drawer-foot">
      <a class="btn-primary" href="${esc(a.url)}" target="_blank" rel="noopener">前往原文 →</a>
      <button class="btn-secondary ${bm?'saved':''}" onclick="toggleBmInDrawer(event,'${esc(a.id)}')">
        ${bm ? '★ 已收藏' : '☆ 收藏'}
      </button>
    </div>
  `;
  d.classList.add('show');
  d.setAttribute('aria-hidden', 'false');
  document.getElementById('drawer-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function renderScoreBreakdown(a) {
  const total = +a.score || 0;
  const bd    = a.score_breakdown;
  if (!bd) {
    return `<div style="margin-top:10px"><div class="score-total">
      <span class="score-total-label">總分</span>
      <span><span class="score-total-val">${total}</span><span class="score-total-max"> / 100</span></span>
    </div></div>`;
  }
  const tier = scoreTier(total);
  const tierHtml = tier ? `<span class="card-tier ${tier.cls}" style="margin-left:8px">${tier.label}</span>` : '';
  const rows = SCORE_DIM_META.map(m => {
    const v = +bd[m.key] || 0;
    const pct = Math.min(100, Math.round(v / m.max * 100));
    return `<div class="score-bar-row">
      <span class="score-bar-label">${m.label}</span>
      <div class="score-bar-track"><div class="score-bar-fill" style="width:${pct}%"></div></div>
      <span class="score-bar-val">${v} / ${m.max}</span>
    </div>`;
  }).join('');
  return `<div style="margin-top:12px">
    <div class="score-total">
      <span class="score-total-label">總分</span>
      <span><span class="score-total-val">${total}</span><span class="score-total-max"> / 100</span>${tierHtml}</span>
    </div>
    ${rows}
  </div>`;
}

function closeDrawer() {
  const d = document.getElementById('drawer');
  d.classList.remove('show');
  d.setAttribute('aria-hidden', 'true');
  document.getElementById('drawer-overlay').classList.remove('show');
  document.body.style.overflow = '';
  drawerArticleId = null;
}

function toggleBmInDrawer(e, id) {
  e.stopPropagation();
  const idx = bookmarks.indexOf(id);
  if (idx >= 0) { bookmarks.splice(idx, 1); toast('已取消收藏'); }
  else          { bookmarks.push(id);        toast('已加入收藏 ★'); }
  localStorage.setItem('ci-bm', JSON.stringify(bookmarks));
  openCardDetail(id);  // re-render button state
  renderSidebar();
  render();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawerArticleId) closeDrawer();
});

// ── Helpers ────────────────────────────────────────────────────
function relTime(iso) {
  if (!iso) return '—';
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 3600)  return Math.floor(d/60)   + ' 分鐘前';
  if (d < 86400) return Math.floor(d/3600) + ' 小時前';
  return Math.floor(d/86400) + ' 天前';
}
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function setText(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = v;
}
function show(...ids) { ids.forEach(id => { const el = document.getElementById(id); if(el) el.style.display='' }) }
function hide(...ids) { ids.forEach(id => { const el = document.getElementById(id); if(el) el.style.display='none' }) }

let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Init ───────────────────────────────────────────────────────
loadURL();
loadData();
</script>
