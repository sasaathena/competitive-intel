<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競品情報 · 產品競品 × 科技趨勢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
:root {
  /* Beige × Forest Green palette (Product view) */
  --sand-50:  #FAFAF5;
  --sand-100: #F5F3EC;
  --sand-200: #EDE9DC;
  --sand-300: #DDD8C6;
  --sand-400: #C8C0A8;
  --sand-500: #A89F87;
  --sand-600: #857A62;

  --moss-50:  #EEF3EF;
  --moss-100: #CFDDD1;
  --moss-200: #9DBEA1;
  --moss-300: #6A9B70;
  --moss-400: #3D7245;
  --moss-500: #2A5430;
  --moss-600: #1C3B21;
  --moss-700: #112416;

  --warm-red: #C0503A;
  --warm-amber: #B5803A;
  --warm-sky: #3A6E8C;

  /* Amber palette (Tech view) */
  --amber-50:  #FBF6EC;
  --amber-100: #F4E7CE;
  --amber-200: #E9CFA1;
  --amber-300: #D9AF6E;
  --amber-400: #C88A3B;
  --amber-500: #A66C22;
  --amber-600: #7A4E17;
  --amber-700: #4C2F0A;

  --bg:        var(--sand-50);
  --bg2:       #FFFFFF;
  --bg3:       var(--sand-100);
  --border:    var(--sand-300);
  --border2:   var(--sand-400);
  --text:      #1C1A14;
  --text2:     #5A5646;
  --text3:     #8A8472;

  --sidebar-bg: var(--moss-600);
  --accent:     var(--moss-500);
  --accent-soft: var(--moss-50);

  --serif: 'Playfair Display', Georgia, serif;
  --sans:  'DM Sans', sans-serif;
  --mono:  'DM Mono', monospace;
  --r: 6px;
  --r2: 10px;
  --r3: 16px;
}

/* Tech view accent swap */
body.view-tech {
  --sidebar-bg: var(--amber-700);
  --accent: var(--amber-500);
  --accent-soft: var(--amber-50);
}

html { font-size: 15px; scroll-behavior: smooth }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
a { color: inherit; text-decoration: none }
button { font-family: var(--sans); cursor: pointer; border: none; background: none }
input  { font-family: var(--sans) }
::-webkit-scrollbar { width: 5px }
::-webkit-scrollbar-track { background: var(--sand-100) }
::-webkit-scrollbar-thumb { background: var(--sand-400); border-radius: 3px }

/* ── Layout ─────────────────────────────────────────────────── */
.app { display: flex; min-height: 100vh }

/* ── Sidebar ─────────────────────────────────────────────────── */
.sidebar {
  width: 236px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  transition: background .25s ease;
}
.sidebar-top {
  padding: 24px 22px 18px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.logo-mark {
  width: 32px; height: 32px;
  background: var(--sand-200);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 600;
  color: var(--sidebar-bg);
  flex-shrink: 0;
  transition: color .25s ease;
}
.logo-name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
  color: var(--sand-100);
  letter-spacing: .01em;
}
.logo-sub {
  font-size: 11px;
  color: rgba(255,255,255,.4);
  font-family: var(--mono);
  letter-spacing: .04em;
}

.nav-section { padding: 16px 12px 4px }
.nav-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.32);
  padding: 0 10px;
  margin-bottom: 5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: var(--r);
  font-size: 13.5px;
  color: rgba(255,255,255,.6);
  cursor: pointer;
  transition: all .15s;
  margin-bottom: 1px;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.9) }
.nav-item.active { background: rgba(255,255,255,.14); color: #fff }
.nav-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.nd-pms   { background: var(--warm-amber) }
.nd-hr    { background: var(--sand-300) }
.nd-crm   { background: var(--moss-200) }
.nd-all   { background: rgba(255,255,255,.4) }
.nd-rss   { background: var(--warm-amber) }
.nd-th    { background: var(--warm-red) }
.nd-ai    { background: #E67E5A }
.nd-glo   { background: #8FB8D6 }
.nd-tw    { background: #F0D28C }
.nd-uxs   { background: #D5B48A }
.nav-count {
  margin-left: auto;
  font-size: 11px;
  font-family: var(--mono);
  color: rgba(255,255,255,.32);
  background: rgba(255,255,255,.06);
  padding: 1px 7px;
  border-radius: 10px;
}

.sync-footer {
  margin-top: auto;
  padding: 16px 22px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  color: rgba(255,255,255,.35);
}
.sync-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
  font-family: var(--mono);
}
.sync-led {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #6ECC7A;
  animation: blink 3s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Main ───────────────────────────────────────────────────── */
.main { flex: 1; overflow: hidden }

/* ── Topbar ─────────────────────────────────────────────────── */
.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 40;
}
.view-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg3);
  padding: 4px;
  border-radius: 22px;
  border: 1px solid var(--border);
}
.view-tab {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 18px;
  color: var(--text3);
  transition: all .18s ease;
  letter-spacing: .01em;
}
.view-tab:hover { color: var(--text2) }
.view-tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
.page-heading {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  color: var(--text2);
  flex: 1;
  letter-spacing: -.01em;
  font-style: italic;
  padding-left: 6px;
}
.search-wrap { position: relative }
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text3);
  pointer-events: none;
}
.search-input {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 14px 7px 34px;
  font-size: 13px;
  color: var(--text);
  width: 210px;
  outline: none;
  transition: border-color .15s, width .2s, box-shadow .15s;
}
.search-input::placeholder { color: var(--text3) }
.search-input:focus {
  border-color: var(--accent);
  width: 260px;
  box-shadow: 0 0 0 3px rgba(42,84,48,.08);
}
body.view-tech .search-input:focus { box-shadow: 0 0 0 3px rgba(200,138,59,.15) }
.refresh-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text2);
  font-size: 16px;
  transition: all .15s;
}
.refresh-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }

/* ── Content ─────────────────────────────────────────────────── */
.content { padding: 24px 32px 48px }

/* ── Metrics ─────────────────────────────────────────────────── */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.metric {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 16px 18px;
  transition: border-color .18s;
  position: relative;
  overflow: hidden;
}
.metric::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
}
.metric.m-green::before { background: var(--moss-400) }
.metric.m-sand::before  { background: var(--sand-400) }
.metric.m-red::before   { background: var(--warm-red) }
.metric.m-sky::before   { background: var(--warm-sky) }
.metric.m-amber::before { background: var(--amber-400) }
.metric:hover { border-color: var(--border2) }
.metric-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}
.metric-icon { font-size: 16px; opacity: .55 }
.metric-badge {
  font-size: 10px;
  font-family: var(--mono);
  padding: 2px 7px;
  border-radius: 10px;
}
.mb-up   { background: #E8F3EB; color: #2A5430 }
.mb-gray { background: var(--sand-100); color: var(--text3) }
.metric-val { font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: -.03em; line-height: 1 }
.metric-lbl { font-size: 11.5px; color: var(--text3); margin-top: 5px }

/* ── Filter Bar ─────────────────────────────────────────────── */
.filter-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 12px 16px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.filter-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text2);
  background: transparent;
  transition: all .15s;
}
.chip:hover { border-color: var(--border2); color: var(--text); background: var(--sand-100) }
.chip.active { border-color: transparent; color: #fff }
.chip-all.active     { background: var(--accent) }
.chip-pms.active     { background: var(--warm-amber) }
.chip-hr.active      { background: var(--moss-400) }
.chip-crm.active     { background: var(--warm-sky) }
.chip-tech.active    { background: var(--amber-500) }
.chip-zh.active      { background: var(--moss-500) }
/* content type chips */
.chip-ct-prod.active { background: var(--moss-500) }
.chip-ct-feat.active { background: var(--warm-amber) }
.chip-ct-fund.active { background: #4C7C8E }
.chip-ct-fin.active  { background: var(--sand-600) }
.chip-ct-hire.active { background: #7B5CA6 }
.chip-ct-trend.active{ background: var(--sand-600) }
.chip-ct-ai.active   { background: var(--warm-red) }
.chip-ct-ux.active   { background: var(--moss-400) }
/* tech sub-buckets */
.chip-sb-ai.active   { background: #E67E5A }
.chip-sb-glo.active  { background: #4C7C8E }
.chip-sb-tw.active   { background: var(--warm-amber) }
.chip-sb-ux.active   { background: var(--amber-500) }

/* ── List Header ─────────────────────────────────────────────── */
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.result-label {
  font-family: var(--serif);
  font-size: 15px;
  font-style: italic;
  color: var(--text3);
}
.result-label span { color: var(--text); font-style: normal; font-weight: 500 }
.sort-group { display: flex; gap: 6px }
.sort-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  border-radius: var(--r);
  font-size: 12px;
  color: var(--text3);
  border: 1px solid var(--border);
  background: var(--bg2);
  transition: all .15s;
}
.sort-btn:hover, .sort-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

/* ── Cards Grid ─────────────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

/* ── Card ───────────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r3);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .18s, transform .2s, box-shadow .2s;
  display: flex;
  flex-direction: column;
  position: relative;
}
.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--moss-400);
  z-index: 2;
}
.card.card-tech::before { background: var(--amber-400) }
.card:hover {
  border-color: var(--sand-400);
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(28,26,20,.09);
}

/* Thumbnail */
.card-thumb {
  width: 100%;
  height: 148px;
  overflow: hidden;
  position: relative;
  background: var(--sand-100);
  flex-shrink: 0;
}
.card-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .4s ease;
  display: block;
}
.card:hover .card-thumb img { transform: scale(1.04) }
.thumb-placeholder {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
}
.thumb-icon { font-size: 28px; opacity: .3 }
.thumb-brand {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 500;
  color: var(--text3);
  opacity: .55;
}

/* System / entity badge on thumb (Product view: emphasise brand) */
.thumb-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 10.5px;
  font-weight: 500;
  font-family: var(--mono);
  padding: 3px 8px;
  border-radius: 10px;
  letter-spacing: .04em;
}
.tb-pms  { background: var(--warm-amber); color: #fff }
.tb-hr   { background: var(--moss-600);   color: var(--sand-100) }
.tb-crm  { background: var(--warm-sky);   color: #fff }
.tb-tech { background: var(--amber-500);  color: #fff }

/* Brand chip — emphasised in Product view */
.thumb-brand-chip {
  position: absolute;
  bottom: 10px;
  left: 10px;
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.94);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  max-width: calc(100% - 20px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Language badge (top-right of thumb) */
.thumb-lang {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  font-family: var(--mono);
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 500;
  background: rgba(255,255,255,.92);
}
.lang-zh { color: var(--moss-600) }
.lang-en { color: var(--text3) }

/* Card body */
.card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 10px }
.card-source-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-source {
  font-size: 11.5px;
  color: var(--text3);
  font-family: var(--mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: calc(100% - 40px);
}
.card-tech .card-source {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 500;
  color: var(--amber-600);
  font-style: italic;
}
.card-bm {
  width: 24px; height: 24px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3);
  font-size: 14px;
  transition: all .15s;
  background: transparent;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}
.card-bm:hover { color: var(--accent); background: var(--accent-soft) }
.card-bm.saved { color: var(--accent) }

.card-title {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-summary {
  font-size: 12px;
  line-height: 1.65;
  color: var(--text2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags { display: flex; gap: 5px; flex-wrap: wrap }
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 10px;
}
.tag-ct-prod  { background: #EEF3EF; color: var(--moss-500) }
.tag-ct-feat  { background: #FAF2E4; color: #7A5520 }
.tag-ct-fund  { background: #E1EBF0; color: #345D6D }
.tag-ct-fin   { background: #F0EBD8; color: #6A5A2F }
.tag-ct-hire  { background: #EEE6F4; color: #6B4C97 }
.tag-ct-trend { background: var(--sand-100); color: var(--sand-600) }
.tag-ct-ai    { background: #FBE9E4; color: var(--warm-red) }
.tag-ct-ux    { background: #E7F0E9; color: var(--moss-500) }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
}
.card-date {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}
.card-open {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  padding: 4px 10px;
  border-radius: var(--r);
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  transition: all .15s;
}
.card-open:hover { background: var(--accent); color: #fff }

/* ── Empty / Loading ─────────────────────────────────────────── */
.state-box {
  text-align: center;
  padding: 64px 24px;
  color: var(--text3);
}
.state-box .icon { font-size: 36px; margin-bottom: 12px; opacity: .3 }
.state-box p { font-family: var(--serif); font-size: 16px; font-style: italic }
.state-box small { font-size: 12px; display: block; margin-top: 6px }
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  margin: 0 auto 14px;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* ── Distribution ────────────────────────────────────────────── */
.dist-row {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 16px 20px;
  margin-bottom: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.dist-group h4 {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 12px;
}
.dist-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.dist-name { font-size: 12px; color: var(--text2); width: 92px; flex-shrink: 0 }
.dist-track { flex: 1; height: 4px; background: var(--sand-200); border-radius: 2px; overflow: hidden }
.dist-fill  { height: 100%; border-radius: 2px; transition: width .7s ease }
.df-moss  { background: var(--moss-400) }
.df-sky   { background: var(--warm-sky) }
.df-amber { background: var(--warm-amber) }
.df-amber2{ background: var(--amber-500) }
.df-red   { background: var(--warm-red) }
.df-sand  { background: var(--sand-500) }
.df-purple{ background: #7B5CA6 }
.df-teal  { background: #4C7C8E }
.dist-num { font-size: 11px; font-family: var(--mono); color: var(--text3); width: 26px; text-align: right }

/* ── Toast ───────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--sidebar-bg);
  color: var(--sand-100);
  font-size: 13px;
  padding: 11px 16px;
  border-radius: var(--r2);
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
  transform: translateY(64px);
  opacity: 0;
  transition: all .25s;
  z-index: 99;
}
.toast.show { transform: translateY(0); opacity: 1 }

/* ── Card animation ──────────────────────────────────────────── */
.card { animation: fadeUp .3s ease both }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px) }
  to   { opacity: 1; transform: translateY(0) }
}
.card:nth-child(1){animation-delay:.04s}
.card:nth-child(2){animation-delay:.08s}
.card:nth-child(3){animation-delay:.12s}
.card:nth-child(4){animation-delay:.16s}
.card:nth-child(5){animation-delay:.20s}
.card:nth-child(6){animation-delay:.24s}
.card:nth-child(7){animation-delay:.28s}
.card:nth-child(8){animation-delay:.32s}
.card:nth-child(9){animation-delay:.36s}

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width: 1100px) {
  .cards-grid { grid-template-columns: repeat(2,1fr) }
  .metrics-row { grid-template-columns: repeat(2,1fr) }
  .dist-row    { grid-template-columns: 1fr }
}
@media (max-width: 720px) {
  .sidebar { display: none }
  .content { padding: 16px }
  .cards-grid { grid-template-columns: 1fr }
  .topbar { padding: 8px 16px; flex-wrap: wrap }
  .page-heading { display: none }
}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <div class="logo-mark" id="logo-mark">情</div>
        <span class="logo-name">競品情報</span>
      </div>
      <div class="logo-sub" id="logo-sub">PRODUCT · TECH</div>
    </div>

    <div id="sidebar-nav"></div>

    <div class="sync-footer">
      <div class="sync-row">
        <div class="sync-led"></div>自動同步正常
      </div>
      <div id="sync-time" style="font-family:var(--mono)">—</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="view-tabs" role="tablist" aria-label="頂層分區">
        <button class="view-tab active" id="tab-product" onclick="setView('product')" role="tab">產品競品</button>
        <button class="view-tab" id="tab-tech" onclick="setView('tech')" role="tab">科技趨勢</button>
      </div>
      <div class="page-heading" id="page-heading">全部情報</div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" type="text" placeholder="搜尋品牌、功能、關鍵字…" id="search-input" oninput="onSearch()">
      </div>
      <button class="refresh-btn" onclick="loadData()" title="重新整理">↻</button>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Loading -->
      <div id="loading" class="state-box">
        <div class="spinner"></div>
        <p>載入情報資料中…</p>
      </div>

      <!-- Metrics -->
      <div class="metrics-row" id="metrics-row" style="display:none"></div>

      <!-- Distribution -->
      <div class="dist-row" id="dist-row" style="display:none">
        <div class="dist-group">
          <h4 id="dist-left-title">系統分布</h4>
          <div id="dist-systems"></div>
        </div>
        <div class="dist-group">
          <h4>內容類型分布</h4>
          <div id="dist-types"></div>
        </div>
      </div>

      <!-- Filter -->
      <div class="filter-wrap" id="filter-wrap" style="display:none"></div>

      <!-- List header -->
      <div class="list-header" id="list-header" style="display:none">
        <div class="result-label">共 <span id="shown-count">0</span> 筆情報</div>
        <div class="sort-group">
          <button class="sort-btn active" id="sort-score" onclick="setSort('score')">✦ 相關度</button>
          <button class="sort-btn" id="sort-date" onclick="setSort('date')">最新</button>
        </div>
      </div>

      <!-- Cards -->
      <div class="cards-grid" id="cards-grid"></div>

      <!-- Empty -->
      <div class="state-box" id="empty-state" style="display:none">
        <div class="icon">◎</div>
        <p>沒有符合條件的情報</p>
        <small>試試放寬篩選條件</small>
      </div>

    </div><!-- .content -->
  </div><!-- .main -->
</div><!-- .app -->

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────
let all = [];
let view          = 'product';    // 'product' | 'tech'
let filterSys     = '';           // Product: '', 'PMS', 'CRM', 'HR'
let filterSubCat  = '';           // Tech:    '', 'AI', 'Global', 'TW', 'Design'
let filterType    = '';           // 內容類型 (八分類)
let filterChannel = '';           // '', 'rss', 'threads'
let filterLangPri = '';           // '', 'zh-TW'
let filterBrand   = '';           // Product view brand dropdown
let onlyBookmarks = false;
let searchQ       = '';
let sortMode      = 'score';
let bookmarks     = JSON.parse(localStorage.getItem('ci-bm') || '[]');

// 舊資料相容
const SYS_ALIAS = { EIP: 'HR' };
function normSystems(sys) {
  if (!Array.isArray(sys)) return [];
  return [...new Set(sys.map(s => SYS_ALIAS[s] || s))];
}
// 舊 type 名稱→新分類 mapping（向後相容既有資料）
const TYPE_ALIAS = {
  '功能更新': '功能發布',
  'Dashboard案例': '用戶體驗',
  'AI應用': 'AI 技術',
};
function normTypes(types) {
  if (!Array.isArray(types)) return [];
  return [...new Set(types.map(t => TYPE_ALIAS[t] || t))];
}

// 語系優先權：繁中 > 英
const LANG_PRIORITY = { 'zh-TW': 2, en: 1 };

// 新 8 分類（依用戶指定順序）
const CONTENT_TYPES = [
  { key: '產品更新',   cls: 'ct-prod'  },
  { key: '功能發布',   cls: 'ct-feat'  },
  { key: '融資動態',   cls: 'ct-fund'  },
  { key: '財報營運',   cls: 'ct-fin'   },
  { key: '人事異動',   cls: 'ct-hire'  },
  { key: '產業趨勢',   cls: 'ct-trend' },
  { key: 'AI 技術',    cls: 'ct-ai'    },
  { key: '用戶體驗',   cls: 'ct-ux'    },
];
const TYPE_CLS = Object.fromEntries(CONTENT_TYPES.map(t => [t.key, `tag-${t.cls}`]));
const TYPE_DIST_CLS = {
  '產品更新': 'df-moss', '功能發布': 'df-amber', '融資動態': 'df-teal',
  '財報營運': 'df-sand', '人事異動': 'df-purple', '產業趨勢': 'df-sand',
  'AI 技術': 'df-red',  '用戶體驗': 'df-moss'
};

// Tech 子分類（source name 前綴判定）
const TECH_SUBCATS = [
  { key: '', label: '全部主題', dot: 'nd-all' },
  { key: 'AI',     label: 'AI 前沿',   dot: 'nd-ai',  prefix: 'TECH/AI'     },
  { key: 'Global', label: '國際科技',  dot: 'nd-glo', prefix: 'TECH/Global' },
  { key: 'TW',     label: '台灣科技',  dot: 'nd-tw',  prefix: 'TECH/TW'     },
  { key: 'Design', label: '設計 / UX', dot: 'nd-uxs', prefix: 'TECH/Design' },
];
function techSubOf(sourceName) {
  if (!sourceName) return '';
  for (const s of TECH_SUBCATS) {
    if (s.prefix && sourceName.startsWith(s.prefix)) return s.key;
  }
  return '';
}

// ── URL sync ──────────────────────────────────────────────────
function syncURL() {
  const p = new URLSearchParams();
  if (view !== 'product') p.set('view', view);
  if (filterSys)     p.set('sys',  filterSys);
  if (filterSubCat)  p.set('sub',  filterSubCat);
  if (filterType)    p.set('type', filterType);
  if (filterBrand)   p.set('brand', filterBrand);
  const q = p.toString();
  history.replaceState(null, '', q ? '?' + q : location.pathname);
}
function loadURL() {
  const p = new URLSearchParams(location.search);
  const v = p.get('view');
  if (v === 'tech' || v === 'product') view = v;
  filterSys    = p.get('sys')   || '';
  filterSubCat = p.get('sub')   || '';
  filterType   = p.get('type')  || '';
  filterBrand  = p.get('brand') || '';
}

// ── Load ───────────────────────────────────────────────────────
async function loadData() {
  show('loading');
  hide('metrics-row','dist-row','filter-wrap','list-header','cards-grid','empty-state');

  try {
    const r = await fetch('data/articles.json?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    all = (d.articles || []).map(a => ({
      ...a,
      systems: normSystems(a.systems),
      types:   normTypes(a.types),
      _sub:    techSubOf(a.source || '')
    }));
    applyView();
    applyStats(d.stats || {});
    hide('loading');
    show('metrics-row','dist-row','filter-wrap','list-header','cards-grid');
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div class="icon">⚠</div><p>無法載入 data/articles.json</p><small>請確認爬蟲已執行或路徑正確</small>`;
  }
}

// ── View switch ────────────────────────────────────────────────
function setView(v) {
  if (view === v) return;
  view = v;
  // 切換 view 時清掉不屬於該 view 的 filter
  if (v === 'product') { filterSubCat = ''; }
  else                 { filterSys = ''; filterBrand = ''; }
  applyView();
  render();
  syncURL();
}
function applyView() {
  document.body.classList.toggle('view-tech', view === 'tech');
  document.getElementById('tab-product').classList.toggle('active', view === 'product');
  document.getElementById('tab-tech').classList.toggle('active', view === 'tech');
  setText('logo-sub', view === 'tech' ? 'AI · TREND · UX' : 'PMS · CRM · HR');
  renderSidebar();
  renderFilterBar();
  renderMetricsSkeleton();
}

// ── Sidebar (dynamic per view) ────────────────────────────────
function renderSidebar() {
  const stats = computeCounts();
  let html = '';

  // 來源管道（共用）
  html += `<div class="nav-section">
    <div class="nav-label">來源管道</div>
    <div class="nav-item ${filterChannel===''?'active':''}" onclick="setChannel('')">
      <div class="nav-dot nd-all"></div>全部來源
      <span class="nav-count">${stats.total}</span>
    </div>
    <div class="nav-item ${filterChannel==='rss'?'active':''}" onclick="setChannel('rss')">
      <div class="nav-dot nd-rss"></div>RSS 訂閱
      <span class="nav-count">${stats.byChannel.rss || 0}</span>
    </div>
    <div class="nav-item ${filterChannel==='threads'?'active':''}" onclick="setChannel('threads')">
      <div class="nav-dot nd-th"></div>Threads
      <span class="nav-count">${stats.byChannel.threads || 0}</span>
    </div>
  </div>`;

  if (view === 'product') {
    html += `<div class="nav-section">
      <div class="nav-label">核心系統</div>
      <div class="nav-item ${filterSys===''?'active':''}" onclick="setSysNav('')">
        <div class="nav-dot nd-all"></div>全部系統
        <span class="nav-count">${stats.productTotal}</span>
      </div>
      <div class="nav-item ${filterSys==='PMS'?'active':''}" onclick="setSysNav('PMS')">
        <div class="nav-dot nd-pms"></div>PMS · 旅宿管理
        <span class="nav-count">${stats.bySystem.PMS || 0}</span>
      </div>
      <div class="nav-item ${filterSys==='CRM'?'active':''}" onclick="setSysNav('CRM')">
        <div class="nav-dot nd-crm"></div>CRM · 客戶關係
        <span class="nav-count">${stats.bySystem.CRM || 0}</span>
      </div>
      <div class="nav-item ${filterSys==='HR'?'active':''}" onclick="setSysNav('HR')">
        <div class="nav-dot nd-hr"></div>HR · 人資系統
        <span class="nav-count">${stats.bySystem.HR || 0}</span>
      </div>
    </div>`;
  } else {
    html += `<div class="nav-section">
      <div class="nav-label">主題分類</div>` +
      TECH_SUBCATS.map(s => `
        <div class="nav-item ${filterSubCat===s.key?'active':''}" onclick="setSubCat('${s.key}')">
          <div class="nav-dot ${s.dot}"></div>${s.label}
          <span class="nav-count">${s.key ? (stats.bySub[s.key] || 0) : stats.techTotal}</span>
        </div>`).join('') +
      `</div>`;
  }

  // 收藏
  html += `<div class="nav-section">
    <div class="nav-label">個人</div>
    <div class="nav-item ${onlyBookmarks?'active':''}" onclick="toggleBookmarksNav()">
      <div class="nav-dot nd-th"></div>我的收藏
      <span class="nav-count">${bookmarks.length}</span>
    </div>
  </div>`;

  document.getElementById('sidebar-nav').innerHTML = html;
}

// ── Filter bar (dynamic per view) ─────────────────────────────
function renderFilterBar() {
  let html = '';

  if (view === 'product') {
    html += `<div class="filter-group">
      <span class="filter-label">系統</span>
      <button class="chip chip-all ${filterSys===''?'active':''}" onclick="setSys('')">全部</button>
      <button class="chip chip-pms ${filterSys==='PMS'?'active':''}" onclick="setSys('PMS')">PMS</button>
      <button class="chip chip-crm ${filterSys==='CRM'?'active':''}" onclick="setSys('CRM')">CRM</button>
      <button class="chip chip-hr  ${filterSys==='HR'?'active':''}"  onclick="setSys('HR')">HR</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">品牌</span>
      <select onchange="setBrand(this.value)" style="font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;">
        <option value="">全部品牌</option>
        ${brandOptions().map(b => `<option value="${esc(b)}" ${filterBrand===b?'selected':''}>${esc(b)}</option>`).join('')}
      </select>
    </div>`;
  } else {
    html += `<div class="filter-group">
      <span class="filter-label">主題</span>` +
      TECH_SUBCATS.map(s => {
        const cls = s.key === '' ? 'chip-all' : `chip-sb-${s.key.toLowerCase().replace('global','glo').replace('design','ux')}`;
        return `<button class="chip ${cls} ${filterSubCat===s.key?'active':''}" onclick="setSubCat('${s.key}')">${s.label}</button>`;
      }).join('') +
      `</div>`;
  }

  html += `<div class="filter-sep"></div>
  <div class="filter-group">
    <span class="filter-label">內容類型</span>
    <button class="chip chip-all ${filterType===''?'active':''}" onclick="setType('')">全部</button>` +
    CONTENT_TYPES.map(t =>
      `<button class="chip chip-${t.cls} ${filterType===t.key?'active':''}" onclick="setType('${t.key}')">${t.key}</button>`
    ).join('') +
  `</div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <span class="filter-label">語系</span>
    <button class="chip chip-all ${filterLangPri===''?'active':''}" onclick="setLangPri('')">全部</button>
    <button class="chip chip-zh ${filterLangPri==='zh-TW'?'active':''}" onclick="setLangPri('zh-TW')">🇹🇼 繁中</button>
  </div>`;

  document.getElementById('filter-wrap').innerHTML = html;
}

// ── Metrics（view-aware skeleton） ─────────────────────────────
function renderMetricsSkeleton() {
  const bar = view === 'tech' ? 'm-amber' : 'm-green';
  document.getElementById('metrics-row').innerHTML = `
    <div class="metric ${bar}">
      <div class="metric-top"><span class="metric-icon">📋</span>
        <span class="metric-badge mb-up" id="badge-new">+0 今日</span></div>
      <div class="metric-val" id="m-total">0</div>
      <div class="metric-lbl">當前顯示情報</div>
    </div>
    <div class="metric m-sand">
      <div class="metric-top"><span class="metric-icon">🗓</span>
        <span class="metric-badge mb-up" id="badge-today">今日</span></div>
      <div class="metric-val" id="m-today">0</div>
      <div class="metric-lbl">今日新增</div>
    </div>
    <div class="metric ${view==='tech'?'m-sky':'m-red'}">
      <div class="metric-top"><span class="metric-icon">${view==='tech'?'💡':'⚡'}</span>
        <span class="metric-badge mb-gray">${view==='tech'?'熱門主題':'產品動態'}</span></div>
      <div class="metric-val" id="m-mid">0</div>
      <div class="metric-lbl">${view==='tech'?'今日熱門類型':'產品更新+功能發布'}</div>
    </div>
    <div class="metric m-sky">
      <div class="metric-top"><span class="metric-icon">${view==='tech'?'📚':'🏷'}</span>
        <span class="metric-badge mb-gray">${view==='tech'?'來源數':'品牌覆蓋'}</span></div>
      <div class="metric-val" id="m-right">0</div>
      <div class="metric-lbl">${view==='tech'?'不同 publication 數':'涵蓋品牌數'}</div>
    </div>`;
  document.getElementById('dist-left-title').textContent = view === 'tech' ? '主題分類分布' : '系統分布';
}

// ── Stats ─────────────────────────────────────────────────────
function computeCounts() {
  const byChannel = {}, bySystem = {}, bySub = {};
  let productTotal = 0, techTotal = 0;
  for (const a of all) {
    byChannel[a.channel] = (byChannel[a.channel] || 0) + 1;
    for (const s of a.systems || []) {
      bySystem[s] = (bySystem[s] || 0) + 1;
      if (s === 'TECH') techTotal++;
      else if (s === 'PMS' || s === 'CRM' || s === 'HR') productTotal++;
    }
    if (a._sub) bySub[a._sub] = (bySub[a._sub] || 0) + 1;
  }
  return { total: all.length, byChannel, bySystem, bySub, productTotal, techTotal };
}
function brandOptions() {
  const set = new Set();
  for (const a of all) {
    if (view === 'product' && !(a.systems || []).some(s => s !== 'TECH')) continue;
    (a.brands || []).forEach(b => set.add(b));
  }
  return [...set].sort();
}

function applyStats(s) {
  const t = s.last_updated ? new Date(s.last_updated).toLocaleString('zh-TW',{
    month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'
  }) : '—';
  setText('sync-time', t);
}

function updateMetrics(items) {
  const today = items.filter(a => {
    const d = new Date(a.date);
    return (Date.now() - d) < 86400 * 1000;
  }).length;
  setText('m-total', items.length);
  setText('m-today', today);
  setText('badge-new',   '+' + today + ' 今日');
  setText('badge-today', today + ' 篇');

  if (view === 'tech') {
    // 熱門主題（top type + 次數）
    const typeCount = {};
    for (const a of items) for (const t of a.types || []) typeCount[t] = (typeCount[t] || 0) + 1;
    const top = Object.entries(typeCount).sort((a,b) => b[1]-a[1])[0];
    setText('m-mid', top ? top[1] : 0);
    // 來源多樣性
    const srcSet = new Set(items.map(a => (a.source || '').split('·')[0]));
    setText('m-right', srcSet.size);
  } else {
    // 產品更新 + 功能發布 合計
    let prod = 0;
    for (const a of items) if ((a.types || []).some(t => t === '產品更新' || t === '功能發布')) prod++;
    setText('m-mid', prod);
    // 品牌覆蓋
    const brandSet = new Set();
    for (const a of items) (a.brands || []).forEach(b => brandSet.add(b));
    setText('m-right', brandSet.size);
  }

  // Distribution
  const distLeft = {};
  if (view === 'tech') {
    for (const a of items) if (a._sub) {
      const label = TECH_SUBCATS.find(s => s.key === a._sub)?.label || a._sub;
      distLeft[label] = (distLeft[label] || 0) + 1;
    }
  } else {
    for (const a of items) for (const s of a.systems || []) {
      if (s === 'TECH') continue;
      distLeft[s] = (distLeft[s] || 0) + 1;
    }
  }
  const distTypes = {};
  for (const a of items) for (const t of a.types || []) distTypes[t] = (distTypes[t] || 0) + 1;

  renderDist('dist-systems', distLeft,
    view === 'tech'
      ? {'AI 前沿':'df-red','國際科技':'df-teal','台灣科技':'df-amber','設計 / UX':'df-amber2'}
      : {PMS:'df-amber', CRM:'df-sky', HR:'df-moss'});
  renderDist('dist-types', distTypes, TYPE_DIST_CLS);
}

function renderDist(id, data, colors) {
  const max = Math.max(...Object.values(data), 1);
  document.getElementById(id).innerHTML = Object.entries(data)
    .sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `
    <div class="dist-item">
      <span class="dist-name">${esc(k)}</span>
      <div class="dist-track"><div class="dist-fill ${colors[k]||'df-sand'}" style="width:${Math.round(v/max*100)}%"></div></div>
      <span class="dist-num">${v}</span>
    </div>`).join('');
}

// ── Filter setters ────────────────────────────────────────────
function setSys(v)     { filterSys = v;     onlyBookmarks = false; renderSidebar(); renderFilterBar(); render(); syncURL(); }
function setSysNav(v)  { setSys(v); }
function setSubCat(v)  { filterSubCat = v;  onlyBookmarks = false; renderSidebar(); renderFilterBar(); render(); syncURL(); }
function setType(v)    { filterType = v;    renderFilterBar(); render(); syncURL(); }
function setChannel(v) { filterChannel = v; renderSidebar();   render(); syncURL(); }
function setLangPri(v) { filterLangPri = v; renderFilterBar(); render(); }
function setBrand(v)   { filterBrand = v;   renderFilterBar(); render(); syncURL(); }
function toggleBookmarksNav() { onlyBookmarks = !onlyBookmarks; renderSidebar(); render(); }
function setSort(m) {
  sortMode = m;
  document.getElementById('sort-score').classList.toggle('active', m==='score');
  document.getElementById('sort-date').classList.toggle('active',  m==='date');
  render();
}
function onSearch() {
  searchQ = document.getElementById('search-input').value.trim().toLowerCase();
  render();
}

// ── Render ─────────────────────────────────────────────────────
function langOf(a) {
  if (a.lang && a.lang !== 'ja') return a.lang;
  if (a.lang === 'ja') return 'en'; // 舊資料若為 ja，視為英文歸類
  return a.is_zhtw ? 'zh-TW' : 'en';
}
function belongsToView(a) {
  const sys = a.systems || [];
  const isTech = sys.includes('TECH');
  const isProduct = sys.some(s => s === 'PMS' || s === 'CRM' || s === 'HR');
  if (view === 'tech')    return isTech;
  return isProduct;   // Product view 排除純 TECH 文章
}

function render() {
  let items = all.filter(a => {
    if (!belongsToView(a)) return false;
    if (onlyBookmarks && !bookmarks.includes(a.id)) return false;
    if (filterChannel && a.channel !== filterChannel) return false;
    if (view === 'product' && filterSys && !a.systems?.includes(filterSys)) return false;
    if (view === 'tech' && filterSubCat && a._sub !== filterSubCat) return false;
    if (filterType && !a.types?.includes(filterType)) return false;
    if (filterLangPri && langOf(a) !== filterLangPri) return false;
    if (filterBrand && !(a.brands || []).includes(filterBrand)) return false;
    if (searchQ) {
      const hay = (a.title + a.summary + a.source + (a.types||[]).join(' ') + (a.brands||[]).join(' ')).toLowerCase();
      if (!hay.includes(searchQ)) return false;
    }
    return true;
  });

  if (sortMode === 'date') {
    items.sort((a,b) => new Date(b.date) - new Date(a.date));
  } else {
    items.sort((a,b) => {
      const la = LANG_PRIORITY[langOf(a)] || 0;
      const lb = LANG_PRIORITY[langOf(b)] || 0;
      if (la !== lb) return lb - la;
      return (b.score||0) - (a.score||0);
    });
  }

  setText('shown-count', items.length);
  show('list-header');
  updateMetrics(items);

  // page heading
  const parts = [view === 'tech' ? '科技趨勢' : '產品競品'];
  if (view === 'product' && filterSys)    parts.push(filterSys);
  if (view === 'tech'    && filterSubCat) parts.push(TECH_SUBCATS.find(s => s.key === filterSubCat)?.label || filterSubCat);
  if (filterType)  parts.push(filterType);
  if (onlyBookmarks) parts.push('★ 收藏');
  setText('page-heading', parts.join(' · '));

  const grid = document.getElementById('cards-grid');
  if (items.length === 0) {
    grid.innerHTML = '';
    hide('cards-grid');
    show('empty-state');
    return;
  }
  hide('empty-state');
  show('cards-grid');
  grid.innerHTML = items.map(renderCard).join('');
}

// ── Card HTML ──────────────────────────────────────────────────
const SYS_CLS  = { PMS:'tb-pms', CRM:'tb-crm', HR:'tb-hr', TECH:'tb-tech' };
const SYS_LABEL= { PMS:'PMS', CRM:'CRM', HR:'HR', TECH:'TECH' };
const THUMB_COLORS = {
  PMS: 'background:linear-gradient(135deg,#F1E1C0 0%,#FAF4E6 100%)',
  HR:  'background:linear-gradient(135deg,#CFDDD1 0%,#EEF3EF 100%)',
  CRM: 'background:linear-gradient(135deg,#D3E4EE 0%,#EEF4F7 100%)',
  TECH:'background:linear-gradient(135deg,#F4E7CE 0%,#FBF6EC 100%)',
};
const THUMB_ICONS = { PMS:'🏨', HR:'👤', CRM:'🤝', TECH:'✨', default:'📄' };
const LANG_LABEL  = { 'zh-TW':'繁', en:'EN' };
const LANG_CLS    = { 'zh-TW':'lang-zh', en:'lang-en' };

function primarySystem(a) {
  const sys = a.systems || [];
  if (view === 'tech' && sys.includes('TECH')) return 'TECH';
  const order = ['PMS','CRM','HR','TECH'];
  return order.find(s => sys.includes(s)) || 'HR';
}
function cleanSource(src) {
  if (!src) return '';
  // TECH/AI·Anthropic → Anthropic
  const parts = src.split('·');
  return parts.length > 1 ? parts.slice(1).join('·') : src;
}

function renderCard(a) {
  const sys   = primarySystem(a);
  const bm    = bookmarks.includes(a.id);
  const tags  = (a.types || []).slice(0,3);
  const rel   = relTime(a.date);
  const safeUrl = esc(a.url);
  const safeId  = esc(a.id);
  const lang    = langOf(a);
  const isTech  = sys === 'TECH';
  const brand   = (a.brands || [])[0];

  const thumbHtml = a.thumbnail
    ? `<img src="${esc(a.thumbnail)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML=fallbackThumb('${sys}','${esc(a.source)}')">`
    : `<div class="thumb-placeholder" style="${THUMB_COLORS[sys]||''}">
        <div class="thumb-icon">${THUMB_ICONS[sys]||THUMB_ICONS.default}</div>
        <div class="thumb-brand">${esc(cleanSource(a.source))}</div>
       </div>`;

  const tagHtml = tags.map(t =>
    `<span class="tag ${TYPE_CLS[t]||'tag-ct-trend'}">${esc(t)}</span>`).join('');

  const brandChip = (!isTech && brand)
    ? `<span class="thumb-brand-chip">${esc(brand)}</span>` : '';

  return `
  <div class="card ${isTech ? 'card-tech' : ''}" onclick="openCard('${safeUrl}')">
    <div class="card-thumb">
      ${thumbHtml}
      <span class="thumb-badge ${SYS_CLS[sys]||'tb-hr'}">${SYS_LABEL[sys]||sys}</span>
      <span class="thumb-lang ${LANG_CLS[lang]||'lang-en'}">${LANG_LABEL[lang]||'EN'}</span>
      ${brandChip}
    </div>
    <div class="card-body">
      <div class="card-source-row">
        <span class="card-source" title="${esc(a.source)}">${esc(cleanSource(a.source))}</span>
        <button class="card-bm ${bm?'saved':''}" onclick="toggleBm(event,'${safeId}')" title="收藏">
          ${bm ? '★' : '☆'}
        </button>
      </div>
      <div class="card-title">${esc(a.title)}</div>
      ${a.summary ? `<div class="card-summary">${esc(a.summary)}</div>` : ''}
      <div class="card-tags">${tagHtml}</div>
      <div class="card-footer">
        <span class="card-date">${rel}</span>
        <span class="card-open">前往 →</span>
      </div>
    </div>
  </div>`;
}

function fallbackThumb(sys, src) {
  return `<div class="thumb-placeholder" style="${THUMB_COLORS[sys]||''}">
    <div class="thumb-icon">${THUMB_ICONS[sys]||'📄'}</div>
    <div class="thumb-brand">${esc(cleanSource(src||''))}</div>
  </div>`;
}

// ── Actions ────────────────────────────────────────────────────
function openCard(url) { window.open(url, '_blank', 'noopener') }

function toggleBm(e, id) {
  e.stopPropagation();
  if (bookmarks.includes(id)) {
    bookmarks = bookmarks.filter(b => b !== id);
    toast('已取消收藏');
  } else {
    bookmarks.push(id);
    toast('已加入收藏 ★');
  }
  localStorage.setItem('ci-bm', JSON.stringify(bookmarks));
  renderSidebar();
  render();
}

// ── Helpers ────────────────────────────────────────────────────
function relTime(iso) {
  if (!iso) return '—';
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 3600)  return Math.floor(d/60)   + ' 分鐘前';
  if (d < 86400) return Math.floor(d/3600) + ' 小時前';
  return Math.floor(d/86400) + ' 天前';
}
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function setText(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = v;
}
function show(...ids) { ids.forEach(id => { const el = document.getElementById(id); if(el) el.style.display='' }) }
function hide(...ids) { ids.forEach(id => { const el = document.getElementById(id); if(el) el.style.display='none' }) }

let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Init ───────────────────────────────────────────────────────
loadURL();
loadData();
</script>
