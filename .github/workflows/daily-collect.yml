name: 每日競品情報收集

on:
  schedule:
    # 每天台灣時間 09:00（UTC+8 = UTC 01:00）
    - cron: "0 1 * * *"
  # 也可手動在 GitHub Actions 頁面觸發
  workflow_dispatch:

# 同一 workflow 排隊執行，避免兩份跑同時 push 造成衝突
concurrency:
  group: daily-collect
  cancel-in-progress: false

permissions:
  contents: write   # 允許推送資料回儲存庫

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 取得程式碼（完整歷史，rebase 才不會踩到 shallow update 限制）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 設定 Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. 安裝相依套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 執行爬蟲
      - name: Run scraper
        run: python collect.py

      # 5. 同步資料到 GitHub Pages (docs 資料夾)
      - name: Sync data to docs
        run: |
          mkdir -p docs/data
          if [ -f "data/articles.json" ]; then
            cp data/articles.json docs/data/articles.json
          fi
          if [ -f "data/seen_ids.json" ]; then
            cp data/seen_ids.json docs/data/seen_ids.json
          fi

      # 6. 如果有任何異動，commit 並 push 回 GitHub
      #    - 執行期間 main 可能被別的 PR 合併推進，因此加 pull-rebase + retry
      #    - -X theirs：articles.json 衝突時以本次 collect 的新資料為準
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/ || true

          if git diff --cached --quiet; then
            echo "沒有異動，略過 commit"
            exit 0
          fi

          git commit -m "chore: 自動更新競品情報 $(date +'%Y-%m-%d')"

          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "第 $i 次 push 成功"
              exit 0
            fi
            echo "第 $i 次 push 失敗，等 5 秒重試..."
            sleep 5
          done

          echo "3 次重試後仍失敗，放棄"
          exit 1